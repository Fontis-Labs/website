# Publica o conteudo de public/ no GitHub Pages.
#
# Todo commit na main publica. Os caminhos do site sao relativos, entao a mesma
# build serve tanto na URL de projeto do Pages quanto na raiz do dominio proprio.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicacao por vez; a que estiver na fila e descartada em favor da mais nova.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verificar assets antes de publicar
        run: node scripts/check-assets.mjs

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v5
